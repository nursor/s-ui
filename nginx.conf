# Nginx配置 - 基于SNI的443端口流量路由
# 嗅探但不解密SSL流量，根据SNI进行转发
# 
# 使用方法：
# 1. 确保nginx支持stream模块（见NGINX_INSTALL.md）
# 2. 如果使用Alpine Linux的nginx-mod-stream包，需要在主配置文件中加载模块：
#    load_module /usr/lib/nginx/modules/ngx_stream_module.so;
# 3. 在主配置文件中包含此文件，或直接在主配置的http块外添加stream块
# 4. 如果使用include方式，在主配置文件中添加：include /path/to/nginx.conf;

# Stream模块配置（需要在nginx主配置中启用stream模块）
stream {
    # 定义SNI到端口的映射
    map $ssl_preread_server_name $backend_port {
        www.bing.com        35004;
        chat.bing.com       35005;
        www.microsoft.com   35001;
        default             0;  # 默认情况，未匹配的域名将无法连接
    }
    # 日志格式
    log_format stream_format '$remote_addr [$time_local] '
                            '$protocol $status $bytes_sent $bytes_received '
                            '$session_time $ssl_preread_server_name -> $backend_port';

    access_log /var/log/nginx/stream_access.log stream_format;
    error_log /var/log/nginx/stream_error.log warn;

    # 443端口监听配置
    server {
        listen 443;
        
        # 根据SNI映射转发到对应端口
        # 如果$backend_port为0（未匹配的域名），连接会被拒绝
        proxy_pass 127.0.0.1:$backend_port;
        
        # 启用SSL预读以获取SNI信息（不解密SSL，只读取SNI）
        ssl_preread on;
        
        # 超时设置
        proxy_timeout 300s;
        proxy_connect_timeout 5s;
        
        # 缓冲区设置
        proxy_buffer_size 16k;
    }
}
