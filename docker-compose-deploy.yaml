version: '3.8'

services:
  sui:
    image: ghcr.io/nursor/s-ui:1.0.5
    container_name: sui-app
    environment:
      # Database configuration (using 127.0.0.1 since network_mode is host)
      SUI_DB_TYPE: mysql
      SUI_DB_HOST: 45.207.193.204
      SUI_DB_PORT: 31494
      SUI_DB_USER: root
      SUI_DB_PASSWORD: asd123456
      SUI_DB_NAME: sui

    network_mode: host
    restart: unless-stopped

  npm:
    image: 'jc21/nginx-proxy-manager:latest'
    container_name: sui-npm
    restart: unless-stopped
    volumes:
      - ./npm_data:/data
      - ./npm_letsencrypt:/etc/letsencrypt
    network_mode: host

volumes:
  mysql_data:
